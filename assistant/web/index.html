<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Copilote — Cieva</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="bar">
      <button id="toggle" class="toggle" type="button" aria-live="polite">
        <span class="dot" aria-hidden="true"></span><span id="toggleLabel">Écouter</span>
      </button>

      <label class="field">
        <span>Contexte</span>
        <select id="mode"></select>
      </label>

      <label class="field">
        <span>Langue</span>
        <select id="lang">
          <option value="fr">Français</option>
          <option value="en">English</option>
        </select>
      </label>

      <label class="field">
        <span>Source</span>
        <select id="source">
          <option value="mic">Micro</option>
          <option value="system">Onglet / écran</option>
        </select>
      </label>

      <label class="switch">
        <input id="auto" type="checkbox" checked />
        <span>Auto</span>
      </label>

      <div class="grow"></div>

      <span id="meta" class="meta"></span>
      <button id="ask" class="ghost" type="button" title="Espace">Répondre</button>
      <button id="deep" class="ghost" type="button" title="D">Détailler</button>
      <button id="compact" class="ghost" type="button" title="C">Compact</button>
      <button id="settingsBtn" class="ghost" type="button" title="P">Dossier</button>
    </header>

    <main class="panes">
      <section class="pane transcript" id="transcriptPane">
        <h2>Ce qui se dit</h2>
        <div id="transcript" class="scroll" aria-live="polite"></div>
        <p id="interim" class="interim"></p>
      </section>

      <section class="pane answers">
        <h2>À dire</h2>
        <div id="answers" class="scroll"></div>
      </section>
    </main>

    <footer class="hint" id="hint">
      <kbd>Espace</kbd> répondre · <kbd>D</kbd> détailler · <kbd>C</kbd> compact ·
      <kbd>P</kbd> dossier · <kbd>Échap</kbd> stopper
    </footer>

    <dialog id="settings">
      <form method="dialog">
        <h2>Dossier</h2>
        <p>
          Les seuls faits que le copilote est autorisé à citer : produits, chiffres,
          références, votre parcours. Tout le reste, il le signalera comme à vérifier.
          Enregistré dans ce navigateur uniquement.
        </p>
        <textarea
          id="profile"
          rows="14"
          placeholder="Ex.
Cieva — agence d'applications métier sur-mesure pour PME (marque de RITECH Services Informatiques).
Produits : Sielo (transport & logistique), Vela (interventions & trésorerie), Lyra (assistant vocal).
Délai de personnalisation : 2 semaines sur base éprouvée.
Référence : client transport passé de 17 à 30 camions.
Mon rôle : ..."
        ></textarea>
        <div class="row">
          <label class="field">
            <span>Déclenchement auto après</span>
            <select id="silence">
              <option value="700">0,7 s de silence</option>
              <option value="1100" selected>1,1 s de silence</option>
              <option value="1800">1,8 s de silence</option>
            </select>
          </label>
          <button class="primary" value="save">Enregistrer</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="/app.js"></script>
  </body>
</html>
