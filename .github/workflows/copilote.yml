name: Copilote — installeurs

# Construit l'app de bureau du copilote (assistant/) :
#   macOS   → Copilote-<version>-arm64.dmg (Apple Silicon) et -x64.dmg (Intel)
#   Windows → Copilote-<version>-installation.exe
#
# Chaque push qui touche assistant/ produit les installeurs en « artefacts »
# de l'exécution (onglet Actions, 30 jours). Un tag copilote-v* publie en
# plus une Release GitHub avec les fichiers attachés.
#
# Le .dmg ne peut se construire que sur un Mac : d'où les runners macOS.
on:
  push:
    paths:
      - 'assistant/**'
      - '.github/workflows/copilote.yml'
    tags:
      - 'copilote-v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: copilote-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: assistant

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: assistant/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: mac
            files: |
              assistant/dist/*.dmg
          - os: windows-latest
            target: win
            files: |
              assistant/dist/*.exe
    runs-on: ${{ matrix.os }}
    env:
      # Signature ad hoc (identity "-" dans package.json) : on n'a pas de
      # certificat Apple, inutile d'en chercher un dans le trousseau.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: assistant/package-lock.json
      - run: npm ci
      - run: npm run dist:${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: Copilote-${{ matrix.target }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/copilote-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installeurs
          merge-multiple: true
      - name: Publier la Release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" installeurs/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Copilote ${GITHUB_REF_NAME#copilote-v}" \
            --notes "Installeurs macOS (Apple Silicon et Intel) et Windows. Voir assistant/README.md pour la première ouverture d'une app non signée."
